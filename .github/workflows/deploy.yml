name: Build and deploy site

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * *"   # daily digest + rebuild (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's digest (scheduled/manual runs)
        # On push this is a no-op if today's digest already exists; the run
        # simply reuses the committed snapshot under data/digests.
        env:
          AI_SUMMARIZE: ${{ vars.AI_SUMMARIZE }}
          AI_CLASSIFY: ${{ vars.AI_CLASSIFY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.run_pipeline --sources sources/sources.yaml --out data/digests

      - name: Build static site
        run: python -m scripts.build_site

      - name: Commit digest snapshot (scheduled/manual only)
        # Keep the daily content snapshot in git so the archive persists.
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digests
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
