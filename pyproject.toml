[project]
name = "cyber-security-news"
version = "0.1.0"
description = "Automated daily cyber security news aggregation"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
